name: Check site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so external links that rot over time get caught.
    - cron: '0 13 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Internal links, placeholders, metadata
        run: python tools/check_site.py

      - name: External links
        # Scheduled runs also verify outbound URLs (ArcGIS items, GitHub repos).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/check_site.py --external
